<style>
:root{--bg:#EDF1F3;--panel:#fff;--ink:#16232F;--muted:#5B6B78;--line:#D4DCE1;--accent:#0E6A86;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1820;--panel:#16222C;--ink:#E4ECF1;--muted:#93A4B1;--line:#2A3945;--accent:#4FB3D1}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:40px 20px}
h1{font-size:26px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 24px}
ul{list-style:none;padding:0;margin:0}
li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
a{color:var(--accent);font-weight:600;text-decoration:none;font-size:16px}
a:hover{text-decoration:underline}
li span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
footer a{font-size:13px;font-weight:400}
</style>
</head>
